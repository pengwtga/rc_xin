services:
  mysql:
    image: mysql:8.0.46
    container_name: rc-xin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: notify
      MYSQL_USER: notify
      MYSQL_PASSWORD: notify123
    ports:
      - "33061:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
