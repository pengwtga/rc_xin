server:
  port: 8080

spring:
  application:
    name: rc-notify
  jackson:
    # 对外契约统一 snake_case（idempotency_key / notification_no ...）
    property-naming-strategy: SNAKE_CASE
  datasource:
    # 默认指向 docker-compose.yml 起的 MySQL 8.0.46（localhost:33061）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:33061}/${MYSQL_DB:notify}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:notify}
    password: ${MYSQL_PASSWORD:notify123}
    hikari:
      # worker 不各持连接：只在认领/落库两个瞬间借还（参数定值依据 §3.5）
      maximum-pool-size: 30
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# 全部运行参数收口于此（T0.3）。每个值的推导见《API通知系统_参数定值依据.md》
notify:
  # 静态 API Key 表（T1.1）：api-key -> caller-id 一对一，caller 由凭证派生而非请求体字段。
  # MVP 放在配置里；生产应由配置中心/密钥管理注入，不在仓库留真实密钥。
  auth:
    clients:
      - api-key: k_shop
        caller-id: shop
      - api-key: k_crm
        caller-id: crm
      - api-key: k_inventory
        caller-id: inventory
        max-attempts: 6          # 可按接入方覆盖重试预算（默认取 notify.retry.max-attempts）
  # 凭证与请求体加密（T2.4）：headers_enc / body_enc 落库前用 AES-256-GCM 加密。
  # 仓库内是开发密钥（启动会打 WARN），生产必须注入：export NOTIFY_CRYPTO_KEY=$(openssl rand -base64 32)
  crypto:
    key: ${NOTIFY_CRYPTO_KEY:ZGV2LW9ubHktMzJieXRlLWtleS1kby1ub3QtdXNlISE=}
  # 出站目标安全策略（T2.4）：默认禁止任何回环/私有/链路本地/CGNAT 目标，非白名单目标强制 https。
  # 白名单只放内网自建回调；生产应为空。开发/演示用：export NOTIFY_SSRF_ALLOWED_HOSTS=127.0.0.1
  ssrf:
    allowed-hosts: ${NOTIFY_SSRF_ALLOWED_HOSTS:}
    require-https: true
  # 端点隔离与熔断（T2.5）：一个供应商变慢，不该把 200 个 worker 全占了让别人排队。
  # 两层强度不同：并发上限在故障早期就生效（不需要判断"是否故障"）；熔断器在故障确认后
  # 停止无效尝试并保住重试预算（不是限流）。跳过一律退预算——见 Dispatcher#skip。
  circuit:
    enabled: ${NOTIFY_CIRCUIT_ENABLED:true}
    window-seconds: 60            # 失败率统计窗口（6 桶 × 10s 的滑动窗口）
    min-samples: 20               # 样本不足时"2 次里 2 次失败"是噪声不是故障
    failure-rate-threshold: 0.5   # 超过即 OPEN；不用 1.0 是因为全失败时已白打 20 次
    open-ms: 60000                # OPEN 时长：与窗口同量级，短了没等对方恢复又打一轮
    half-open-probes: 1           # 半开只放一个探针，成功才恢复全量（防恢复瞬间惊群）
    max-concurrent-per-endpoint: 16  # 200 worker / 约 12 个活跃端点，给单端点留 8 倍余量
    skip-delay-seconds: 30        # 熔断期间的任务推迟多久（带 ±20% 抖动）
    permit-delay-seconds: 2       # 并发满只是排队，短延迟让它尽快回来
    max-tracked-endpoints: 10000  # 端点键来自 URL，不设上限就是一条内存耗尽路径
  dispatcher:
    # 测试环境置 false，改为手动调用 pollOnce()（设计文档 §9.2 用例 7）
    scheduler-enabled: ${NOTIFY_SCHEDULER_ENABLED:true}
    poll-interval-ms: 500        # 体验型：SLA p99<5s 中分给队列等待的 ~10%
    batch-size-max: 100          # 耦合型：<= worker-pool-size，且 >= 每周期补给需求(~86)
    worker-pool-size: 200        # 容量型：覆盖"下游整体慢 5 倍"故障态，极端态交给熔断
    lease-ttl-ms: 60000          # 耦合型：> total-timeout(15s)+余量，双投率由比值决定
  http:
    connect-timeout-ms: 3000     # 防御型：TCP 握手正常值的 30 倍
    total-timeout-ms: 15000      # 防御型：对端 P99 的 ~15 倍
  backoff:
    base-ms: 10000               # delay(n) = min(cap, base*2^(n-1)) * rand(1-j, 1+j)
    cap-ms: 3600000              # 尾部保持小时级节奏，控制权交还人工重放
    jitter: 0.5                  # 全抖动防惊群（供应商恢复瞬间所有任务同秒涌出）
  retry:
    max-attempts: 10             # 业务型：退避曲线累计 ~3.5h ≈ 补偿窗口
  backpressure:
    max-pending: 100000          # ~10 分钟消化时间（172 QPS 消费速率）
    max-oldest-age-minutes: 30   # p99 SLA(5s) 的 360 倍，明确异常信号
    retry-after-seconds: 30      # 拒绝时让调用方等 30s：短了等于没背压（立刻回来），长了业务回调整体推迟
  # 队列健康度采样（T3.3）：监控抓取只读内存快照，不查库（见 QueueSampler 类注释）
  metrics:
    sample-interval-ms: 10000    # 10s：相对 30 分钟的背压阈值可忽略，同时把查库频率压到可接受
  # 归档（T3.3）：只清密文列，不删行——行是"这条为什么没到"的唯一证据
  archive:
    enabled: ${NOTIFY_ARCHIVE_ENABLED:true}
    cron: "0 30 3 * * *"         # 凌晨 3:30：业务低峰，且离"前一天 24h 边界"最近
    success-retention-hours: 24  # 成功单：投递已完成，请求体只剩当天排障的价值
    failure-retention-days: 7    # 失败终态：要撑到人工重放（重放常发生在供应商修好之后）
    batch-size: 1000             # 单批 1000 行：锁持有时间毫秒级，不挡认领
    max-batches-per-run: 100     # 单次最多 10 万行，执行时长有上界（清不完留给下一次）
  # 失败分类无配置项：3xx/4xx → PERMANENT、5xx/网络错误 → RETRYABLE 是硬编码语义。
  # "某供应商用 400 表示系统忙"不做端点覆盖表（T2.1 文档 §2.3：替下游接口不规范买单，
  # 且假设同 host 语义一致）。真有不得不的原因，改 ErrorClassifier 一行代码，不走配置。

logging:
  level:
    org.flywaydb: INFO
